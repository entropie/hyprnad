{
  "layer": "top",
  "position": "bottom",
  "height": 20,
  "spacing": 0,
  "output": ["HDMI-A-2"],
  "on-sigusr1": "toggle",

  "modules-left": ["hyprland/workspaces"],
  "modules-center":["hyprland/window"],
  "modules-right":["network", "tray", "battery", "clock#norm", "clock#secs"],

  "hyprland/workspaces": {
    "format": "{name}",
    "all-outputs": true,
    "active-only": false,
    "sort-by": "id",
  },


  "clock#norm": {
    "interval": 10,
    "format": "{:%H%M}",
    "max-length": 25
                  },


  "clock#secs": {
    "interval": 1,
    "format": "<span>{:%S}</span>",
    "max-length": 25
},


  "hyprland/window": {
    "max-length": 70,
    "format": "{}",
    "separate-outputs": false,
    "rewrite": {
      "": "🪹"
    },

  },

  "tray": {
    "spacing": 0,
    "icon-size": 20
  },


  "group/system": {
    "orientation": "horizontal",
    "modules":[
      "custom/notification",
      "bluetooth",
      "battery"
    ]
  },

  "bluetooth": {
    "format": "{icon}",
    "format-icons": {
      "enabled": "󰂱",
      "connected": "ᛒ",
      "disconnected": "󰂲"
    },
    "on-click": "ghostty --class=waybar.popup --confirm-close-surface=false -e bluetui"
  },

  "network": {
    "interface": "wlan0",
    "format-wifi": "{bandwidthTotalBytes}",
    "format-disconnected": "",
    "tooltip-format": "{essid}: {ipaddr}",
  },

  "battery": {
    "states": { "warning": 30, "critical": 15 },
    "format": "{icon}",
    "format-icons": ["🪫", "🪫", "🔋", "🔋", "🔋⚡"]
  }
}
